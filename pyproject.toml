[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moderaguard"
version = "0.1.0"
description = "ModeraGuard: multi-model comment moderation with fairness auditing and drift-triggered retraining"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pandera>=0.20",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "pyarrow>=15",
]

[project.optional-dependencies]
train = ["mlflow>=3.0", "optuna>=3.6", "fairlearn>=0.10", "dvc[s3]>=3.50", "boto3>=1.34"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "prometheus-client>=0.20", "mlflow-skinny>=3.0", "boto3>=1.34"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["data", "models", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "services/gateway", "services/model-service", "services/drift-job", "services/alert-bridge"]
markers = ["integration: needs the full Docker Compose stack running"]
addopts = "-m 'not integration'"

[tool.ruff.lint.isort]
# service modules are imported by tests and DAGs under their own names
known-first-party = ["moderaguard", "gateway", "model_service", "drift", "bridge", "moderaguard_common"]
