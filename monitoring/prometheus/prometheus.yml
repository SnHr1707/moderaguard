# Prometheus for the Docker Compose stack (owner: M7).
# The Kubernetes version (pod discovery) is in k8s/monitoring/.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: moderaguard-services
    metrics_path: /metrics/
    static_configs:
      - targets: ["gateway:8000"]
        labels: {app: gateway}
      - targets: ["toxicity-svc:8001"]
        labels: {app: toxicity-svc}
      - targets: ["spam-svc:8002"]
        labels: {app: spam-svc}
      - targets: ["langid-svc:8003"]
        labels: {app: langid-svc}

  - job_name: pushgateway
    honor_labels: true          # keep the job label the drift job pushed
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: postgres                # the database (Lab 7)
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: node                    # the server / VM (Lab 7)
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
