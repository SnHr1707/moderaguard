# Single source of truth for pipeline settings. DVC tracks changes to this file,
# so editing a value and running `dvc repro` re-runs only the affected stages.

data:
  # Where the real datasets are placed (see docs/DATA.md). If they are missing,
  # the pipeline falls back to the small sample in data/sample/.
  jigsaw_path: data/raw/jigsaw/all_data.csv
  spam_dir: data/raw/youtube_spam
  max_rows: 200000          # subsample Jigsaw to keep training fast on a laptop
  toxicity_threshold: 0.5   # Jigsaw score >= this counts as toxic
  # Comments created on/after this date are held back as the "future" stream.
  # They are what the producer replays to cause real drift.
  drift_split_date: "2017-06-01"
  test_size: 0.2
  seed: 42

features:
  word_max_features: 50000
  word_ngram_max: 2
  char_max_features: 50000
  char_ngram_min: 3
  char_ngram_max: 5
  min_df: 2

toxicity:
  # Bias mitigation (owner: M4). Two techniques, both on by default:
  # 1. Counterfactual data augmentation: each training comment that mentions an
  #    identity group is copied with that group swapped for another (same
  #    label), so naming a group stops being a toxicity signal.
  # 2. Neutral comments mentioning a group get a higher training weight.
  # Compare with `train --no-mitigation` in the fairness report.
  mitigation:
    counterfactual_copies: 8
    neutral_identity_weight: 1.0
  champion:
    algorithm: logreg
    C: 4.0
    class_weight: balanced
  challenger:
    algorithm: linear_svm
    C: 0.5
    class_weight: balanced

spam:
  algorithm: logreg
  C: 2.0
  class_weight: balanced

tuning:
  n_trials: 20

fairness:
  # Identity groups audited (columns in the Jigsaw data)
  identity_columns:
    - male
    - female
    - homosexual_gay_or_lesbian
    - christian
    - jewish
    - muslim
    - black
    - white
    - psychiatric_or_mental_illness
  identity_threshold: 0.5
  min_group_size: 30

quality_gate:
  # A candidate must reach this AUC, must not be worse than the champion by
  # more than `max_auc_drop`, and must not widen the worst fairness gap by
  # more than `max_fairness_gap_increase`.
  min_auc: 0.80
  max_auc_drop: 0.005
  max_fairness_gap_increase: 0.02

drift:
  # Share of drifted features at which Alertmanager fires the retrain alert
  threshold: 0.3
  window_size: 1000
