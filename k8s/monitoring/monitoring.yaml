# Monitoring stack in Kubernetes (owner: M7).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: moderaguard-prometheus
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: moderaguard-prometheus
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: moderaguard-prometheus}
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: monitoring}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d",
                 "--web.external-url=/prometheus/", "--web.route-prefix=/"]
          ports: [{containerPort: 9090, name: http}]
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: config
          projected:
            sources:
              - configMap: {name: prometheus-config}
              - configMap: {name: prometheus-alerts}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus}
spec:
  selector: {app: prometheus}
  ports: [{name: http, port: 9090, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
spec:
  replicas: 1
  selector: {matchLabels: {app: alertmanager}}
  template:
    metadata: {labels: {app: alertmanager}}
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          args: ["--config.file=/etc/alertmanager/alertmanager.yml"]
          ports: [{containerPort: 9093, name: http}]
          volumeMounts: [{name: config, mountPath: /etc/alertmanager}]
          resources: {requests: {cpu: 20m, memory: 64Mi}}
      volumes: [{name: config, configMap: {name: alertmanager-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: alertmanager}
spec:
  selector: {app: alertmanager}
  ports: [{name: http, port: 9093, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
spec:
  replicas: 1
  selector: {matchLabels: {app: pushgateway}}
  template:
    metadata: {labels: {app: pushgateway}}
    spec:
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.11.1
          ports: [{containerPort: 9091, name: http}]
          resources: {requests: {cpu: 20m, memory: 32Mi}}
---
# NodePort so the drift job (Airflow, outside the cluster) can push to <VM_IP>:30091
apiVersion: v1
kind: Service
metadata: {name: pushgateway}
spec:
  type: NodePort
  selector: {app: pushgateway}
  ports: [{name: http, port: 9091, targetPort: http, nodePort: 30091}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          ports: [{containerPort: 3000, name: http}]
          env:
            - {name: GF_SERVER_ROOT_URL, value: "%(protocol)s://%(domain)s/grafana/"}
            - {name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: grafana-admin, key: password, optional: true}}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
          resources: {requests: {cpu: 50m, memory: 128Mi}}
      volumes:
        - {name: datasources, configMap: {name: grafana-datasources}}
        - {name: dashboard-provider, configMap: {name: grafana-dashboard-provider}}
        - {name: dashboards, configMap: {name: grafana-dashboards}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana}
spec:
  selector: {app: grafana}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-bridge
spec:
  replicas: 1
  selector: {matchLabels: {app: alert-bridge}}
  template:
    metadata: {labels: {app: alert-bridge}}
    spec:
      containers:
        - name: alert-bridge
          image: moderaguard/alert-bridge
          ports: [{containerPort: 8090, name: http}]
          envFrom: [{configMapRef: {name: monitoring-platform}}]
          env:
            - name: AIRFLOW_PASSWORD
              valueFrom: {secretKeyRef: {name: airflow-api, key: password, optional: true}}
          readinessProbe: {httpGet: {path: /health, port: http}}
          resources: {requests: {cpu: 20m, memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: alert-bridge}
spec:
  selector: {app: alert-bridge}
  ports: [{name: http, port: 8090, targetPort: http}]
---
# http://<VM_IP>/grafana and /prometheus through the same Gateway as the API
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: monitoring
spec:
  parentRefs: [{name: moderaguard, namespace: moderaguard}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /grafana}}]
      backendRefs: [{name: grafana, port: 3000}]
    - matches: [{path: {type: PathPrefix, value: /prometheus}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}
      backendRefs: [{name: prometheus, port: 9090}]
