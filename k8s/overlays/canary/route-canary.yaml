# During a canary the API route splits traffic by weight (owner: M6).
# Rule 2 (header) is the A/B switch: `curl -H "X-Canary: always" ...` always
# reaches the canary, so testers can compare both versions directly.
# scripts/set-canary-weight.sh changes the 90/10 split (10 -> 50 -> 100).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs: [{name: moderaguard}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /ui}}]
      backendRefs: [{name: moderator-ui, port: 8501}]
    - matches:
        - headers: [{name: X-Canary, value: always}]
      backendRefs: [{name: gateway-canary, port: 8000}]
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs:
        - {name: gateway, port: 8000, weight: 90}
        - {name: gateway-canary, port: 8000, weight: 10}
