apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-canary
  labels: {app: gateway-canary, component: gateway, track: canary}
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway-canary}
  template:
    metadata:
      labels: {app: gateway-canary, component: gateway, track: canary}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics/
    spec:
      containers:
        - name: gateway
          image: moderaguard/gateway
          ports: [{containerPort: 8000, name: http}]
          env:
            - {name: VARIANT, value: canary}
            - {name: TOXICITY_URL, value: "http://toxicity-svc-canary:8001"}
            - {name: SPAM_URL, value: "http://spam-svc:8002"}
            - {name: LANGID_URL, value: "http://langid-svc:8003"}
            - name: FEEDBACK_DSN
              valueFrom:
                secretKeyRef: {name: moderaguard-secrets, key: FEEDBACK_DSN, optional: true}
          envFrom:
            - configMapRef: {name: moderaguard-serving}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-canary
  labels: {app: gateway-canary, track: canary}
spec:
  selector: {app: gateway-canary}
  ports: [{name: http, port: 8000, targetPort: http}]
