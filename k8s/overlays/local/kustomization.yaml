# Local cluster on kind (owner: M5).
#   kind create cluster --name moderaguard
#   make kind-load         # loads the locally built images into kind
#   edit platform.env      # your laptop's LAN IP
#   kubectl apply -k k8s/overlays/local
#   kubectl -n moderaguard port-forward svc/gateway 8000:8000
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
configMapGenerator:
  - name: moderaguard-platform
    namespace: moderaguard
    envs: [platform.env]
patches:
  # one gateway replica is plenty on a laptop
  - target: {kind: HorizontalPodAutoscaler, name: gateway}
    patch: |-
      - {op: replace, path: /spec/minReplicas, value: 1}
