# Traffic entry point via the Kubernetes Gateway API (owner: M6).
# k3s's bundled Traefik implements it (enabled by infra/cloud/traefik-config.yaml).
# Traefik's "web" entry point listens on 8000 inside the pod and on port 80 of the VM.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: moderaguard
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      port: 8000
      protocol: HTTP
      allowedRoutes:
        namespaces: {from: All}   # monitoring routes live in their own namespace
---
# http://<VM_IP>/      -> gateway (API, /docs)
# http://<VM_IP>/ui    -> moderator UI
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs: [{name: moderaguard}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /ui}}]
      backendRefs: [{name: moderator-ui, port: 8501}]
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: gateway, port: 8000}]
